<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f1ee">
<title>Docket</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app" id="app">

  <!-- ======== CALENDAR TAB ======== -->
  <section class="view" id="view-calendar">
    <div class="topbar">
      <h1 class="large-title" id="cal-title">Calendar</h1>
      <p class="subhead" id="cal-sub"></p>
      <button class="icon-btn" id="btn-settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
      </button>
    </div>
    <div class="segmented" role="tablist">
      <button data-seg="month" class="active">Month</button>
      <button data-seg="day">Day</button>
      <button data-seg="agenda">Agenda</button>
    </div>
    <div class="view" id="seg-month">
      <div class="month-head"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
      <div class="month-grid" id="month-grid"></div>
    </div>
    <div class="view hidden" id="seg-day">
      <div class="timeline" id="timeline"></div>
    </div>
    <div class="view hidden" id="seg-agenda">
      <div id="agenda"></div>
    </div>
  </section>

  <!-- ======== AGENT TAB ======== -->
  <section class="view hidden" id="view-agent">
    <div class="topbar">
      <h1 class="large-title">Agent</h1>
      <p class="subhead">Tell me what to schedule.</p>
    </div>
    <div class="chat">
      <div class="messages" id="messages"></div>
      <div class="suggest-row" id="suggest"></div>
      <div class="chips" id="chips" style="display:none"></div>
      <div class="composer">
        <input id="chat-input" type="text" placeholder="Message" autocomplete="off" enterkeyhint="send">
        <button id="chat-send" aria-label="Send">↑</button>
      </div>
    </div>
  </section>

  <!-- ======== SETTINGS ======== -->
  <section class="view hidden fullscreen" id="view-settings">
    <div class="topbar">
      <h1 class="large-title">Settings</h1>
      <button class="icon-btn" id="btn-settings-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="settings-body">
      <div class="settings-group">
        <h3>External calendars</h3>
        <p class="settings-note">External events appear as read-only busy blocks — the agent avoids them, but can't edit or delete them.</p>
        <div class="field"><label>iCal secret URL</label>
          <input id="s-ical" type="password" placeholder="https://…" autocomplete="off">
        </div>
        <p class="settings-status" id="s-ical-status"></p>
        <div class="btn-row">
          <button class="btn primary" id="s-ical-save">Save</button>
          <button class="btn ghost" id="s-ical-clear">Remove</button>
        </div>
      </div>
      <div class="settings-group">
        <h3>GNOME Online Accounts</h3>
        <label class="toggle-row"><span>Use calendar accounts</span>
          <input id="s-goa-enabled" type="checkbox">
        </label>
        <div id="s-goa-list"><p class="settings-note">Loading…</p></div>
      </div>
    </div>
  </section>

  <!-- tab bar -->
  <nav class="tabbar">
    <button id="tab-calendar" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
      Calendar
    </button>
    <button id="tab-agent">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/><circle cx="9" cy="12" r="1" fill="currentColor"/><circle cx="13" cy="12" r="1" fill="currentColor"/><circle cx="17" cy="12" r="1" fill="currentColor"/></svg>
      Agent
    </button>
  </nav>

  <!-- event sheet -->
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="grabber"></div>
    <div class="sheet-body">
      <h2 id="sheet-title">New Event</h2>
      <div class="field"><label>Title</label><input id="f-title" type="text" placeholder="Event title"></div>
      <div class="row2">
        <div class="field"><label>Starts</label><input id="f-start" type="datetime-local"></div>
        <div class="field"><label>Ends</label><input id="f-end" type="datetime-local"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Repeat</label>
          <select id="f-rrule">
            <option value="">Never</option>
            <option value="daily">Daily</option>
            <option value="weekdays">Weekdays</option>
            <option value="weekly">Weekly</option>
          </select>
        </div>
        <div class="field"><label>Location</label><input id="f-location" type="text" placeholder="Where"></div>
      </div>
      <div class="field"><label>Notes</label><textarea id="f-notes" placeholder="Notes"></textarea></div>
      <div class="field"><label>Color</label><div class="swatches" id="f-colors"></div></div>
      <div class="btn-row">
        <button class="btn ghost" id="sheet-cancel">Cancel</button>
        <button class="btn primary" id="sheet-save">Save</button>
      </div>
      <button class="btn danger" id="sheet-delete" style="display:none">Delete Event</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
